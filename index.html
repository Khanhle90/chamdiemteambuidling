<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Trọng Tài Chấm Điểm</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    body { -webkit-tap-highlight-color: transparent; font-family: system-ui, -apple-system, sans-serif; }
    .turn-locked { opacity: 0.45; cursor: not-allowed; text-decoration: line-through; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen pb-20">

  <!-- MODAL BẮT BUỘC NHẬP TÊN TRỌNG TÀI -->
  <div id="refereeNameModal" class="fixed inset-0 bg-slate-900/80 z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white p-6 rounded-2xl shadow-xl max-w-sm w-full space-y-4 text-center">
      <div class="w-14 h-14 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center mx-auto text-2xl">
        <i class="fa-solid fa-user-pen"></i>
      </div>
      <div>
        <h3 class="font-bold text-base text-slate-800">Thông Tin Trọng Tài</h3>
        <p class="text-xs text-slate-500 mt-1">Vui lòng nhập Họ & Tên của bạn để xác thực vào nhật ký chấm điểm.</p>
      </div>
      <input type="text" id="refereeNameInput" placeholder="Ví dụ: Nguyễn Văn A..." class="w-full px-4 py-3 border-2 border-slate-300 rounded-xl text-center font-bold text-slate-800 text-sm focus:outline-none focus:border-indigo-600" />
      <button type="button" onclick="window.saveRefereeName()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-sm transition">
        Xác Nhận & Bắt Đầu
      </button>
    </div>
  </div>

  <!-- HEADER -->
  <header class="bg-indigo-700 text-white px-4 py-3 shadow-md sticky top-0 z-30 flex items-center justify-between">
    <div>
      <h1 class="font-bold text-base tracking-wide uppercase flex items-center gap-2">
        <i class="fa-solid fa-stopwatch text-amber-300"></i> Trọng Tài Chấm Điểm
      </h1>
      <div class="flex items-center gap-2 mt-0.5">
        <p id="activeMatchLabel" class="text-xs text-indigo-200">Đang kết nối...</p>
        <span class="text-indigo-300 text-xs">•</span>
        <button type="button" onclick="window.promptEditRefereeName()" class="text-xs text-amber-300 font-bold underline flex items-center gap-1">
          <i class="fa-solid fa-id-badge"></i> <span id="currentRefNameLabel">TT</span>
        </button>
      </div>
    </div>
    <button type="button" onclick="window.fetchData(true)" class="bg-indigo-600 active:bg-indigo-800 px-3 py-1.5 rounded-lg text-xs font-medium flex items-center gap-1.5 border border-indigo-400">
      <i id="syncIcon" class="fa-solid fa-rotate"></i> Đồng bộ
    </button>
  </header>

  <main class="max-w-md mx-auto p-3">

    <!-- TAB 1: CHẤM ĐIỂM -->
    <section id="tab-score" class="space-y-4">
      <div class="bg-white rounded-2xl shadow-sm p-4 border border-slate-200 space-y-4">
        
        <!-- CHỌN ĐỘI CHƠI -->
        <div>
          <div class="flex justify-between items-center mb-1.5">
            <label class="text-xs font-bold uppercase text-slate-600">1. Đội Chơi Của Bạn <span class="text-red-500">*</span></label>
            <span id="teamLockHint" class="text-[11px] text-amber-600 font-bold"><i class="fa-solid fa-lock"></i> Đã chọn là khóa cứng</span>
          </div>
          <div id="teamButtonsContainer" class="grid grid-cols-2 gap-2"></div>
        </div>

        <!-- CHẾ ĐỘ CHẤM -->
        <div>
          <label class="block text-xs font-bold uppercase text-slate-600 mb-1.5">2. Chế Độ Chấm <span class="text-red-500">*</span></label>
          <div class="grid grid-cols-3 gap-2">
            <button type="button" onclick="window.selectMode('Tính giờ')" id="mode-TinhGio" class="mode-btn py-2.5 px-2 rounded-xl font-bold text-xs border-2 transition flex flex-col items-center gap-1"><i class="fa-solid fa-stopwatch text-base"></i> Tính giờ</button>
            <button type="button" onclick="window.selectMode('Đếm số')" id="mode-DemSo" class="mode-btn py-2.5 px-2 rounded-xl font-bold text-xs border-2 transition flex flex-col items-center gap-1"><i class="fa-solid fa-layer-group text-base"></i> Đếm số</button>
            <button type="button" onclick="window.selectMode('Thêm điểm')" id="mode-ThemDiem" class="mode-btn py-2.5 px-2 rounded-xl font-bold text-xs border-2 transition flex flex-col items-center gap-1"><i class="fa-solid fa-circle-plus text-base"></i> Thêm điểm</button>
          </div>
        </div>

        <!-- LƯỢT CHƠI -->
        <div id="turnSection">
          <div class="flex justify-between items-center mb-1.5">
            <label class="text-xs font-bold uppercase text-slate-600">3. Lượt Chơi <span class="text-red-500">*</span></label>
            <span id="turnStatusHint" class="text-[11px] text-indigo-600 font-medium">Khóa lượt đã chấm</span>
          </div>
          <div id="turnButtonsContainer" class="grid grid-cols-6 gap-1.5"></div>
        </div>

        <!-- PHẠM QUY -->
        <div id="foulSection" class="pt-1">
          <label class="flex items-center justify-between p-3 rounded-xl border-2 border-red-200 bg-red-50/60 cursor-pointer">
            <div class="flex items-center gap-2.5">
              <i class="fa-solid fa-triangle-exclamation text-red-600 text-lg"></i>
              <div>
                <div class="text-sm font-bold text-red-700">Phạm Quy (0 điểm)</div>
                <div class="text-[11px] text-red-500">Tự động gán 0đ</div>
              </div>
            </div>
            <input type="checkbox" id="foulCheckbox" onchange="window.updateInputVisibility()" class="w-5 h-5 accent-red-600 rounded" />
          </label>
        </div>

        <!-- NHẬP GIỜ -->
        <div id="timeInputsSection" class="space-y-3">
          <div>
            <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Thời gian (Giây) <span class="text-red-500">*</span></label>
            <input type="number" step="0.01" id="inputSeconds" placeholder="VD: 45.5" class="w-full px-3.5 py-3 text-lg font-bold rounded-xl border-2 border-slate-300 focus:border-indigo-600 focus:outline-none" />
          </div>
          <div>
            <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Số thành viên <span class="text-slate-400 font-normal">(Tùy chọn)</span></label>
            <input type="number" id="inputMembers" placeholder="Để trống nếu tính tổng cả đội" class="w-full px-3.5 py-2.5 text-sm font-semibold rounded-xl border-2 border-slate-200 focus:border-indigo-600 focus:outline-none" />
          </div>
        </div>

        <!-- NHẬP ĐẾM SỐ -->
        <div id="countInputsSection" class="hidden">
          <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Số lượng đếm <span class="text-red-500">*</span></label>
          <input type="number" id="inputCount" placeholder="Nhập số lượng..." class="w-full px-3.5 py-3 text-lg font-bold rounded-xl border-2 border-slate-300 focus:border-indigo-600 focus:outline-none" />
        </div>

        <!-- NHẬP ĐIỂM TRỰC TIẾP -->
        <div id="directPointsSection" class="hidden space-y-2">
          <label class="block text-xs font-bold uppercase text-slate-600">Điểm cộng trực tiếp <span class="text-red-500">*</span></label>
          <div class="grid grid-cols-4 gap-2 mb-2">
            <button type="button" onclick="window.setDirectPoint(10)" class="py-2 bg-emerald-50 border border-emerald-300 rounded-lg font-bold text-emerald-700 text-xs">+10đ</button>
            <button type="button" onclick="window.setDirectPoint(20)" class="py-2 bg-emerald-50 border border-emerald-300 rounded-lg font-bold text-emerald-700 text-xs">+20đ</button>
            <button type="button" onclick="window.setDirectPoint(30)" class="py-2 bg-emerald-50 border border-emerald-300 rounded-lg font-bold text-emerald-700 text-xs">+30đ</button>
            <button type="button" onclick="window.setDirectPoint(50)" class="py-2 bg-emerald-50 border border-emerald-300 rounded-lg font-bold text-emerald-700 text-xs">+50đ</button>
          </div>
          <input type="number" id="inputDirectPoints" value="10" class="w-full px-3.5 py-3 text-lg font-bold rounded-xl border-2 border-slate-300 focus:border-indigo-600 focus:outline-none" />
        </div>

        <!-- NÚT LƯU ĐIỂM -->
        <button type="button" id="submitBtn" onclick="window.submitScore()" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-bold rounded-xl shadow-md text-base flex items-center justify-center gap-2 transition">
          <i class="fa-solid fa-paper-plane"></i> LƯU ĐIỂM NGAY
        </button>
      </div>
    </section>

    <!-- TAB 2: NHẬT KÝ LIVE FEED -->
    <section id="tab-feed" class="hidden space-y-2.5">
      <div class="flex justify-between items-center px-1">
        <h2 class="text-xs font-bold uppercase text-slate-500">Dòng chảy điểm trực tiếp</h2>
        <span id="logCountBadge" class="text-xs bg-indigo-100 text-indigo-700 font-bold px-2 py-0.5 rounded-full">0 lượt</span>
      </div>
      <div id="liveFeedContainer" class="space-y-2"></div>
    </section>

    <!-- TAB 3: BẢNG XẾP HẠNG -->
    <section id="tab-leaderboard" class="hidden space-y-3">
      <h2 class="text-xs font-bold uppercase text-slate-500 px-1">Bảng xếp hạng tổng điểm</h2>
      <div id="leaderboardContainer" class="space-y-2.5"></div>
    </section>

  </main>

  <div id="toast" class="fixed top-16 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-xs font-bold px-4 py-2.5 rounded-full shadow-lg hidden z-50"></div>

  <!-- MENU DÀNH CHO TRỌNG TÀI -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 flex justify-around py-2 z-40 max-w-md mx-auto">
    <button type="button" onclick="window.switchTab('score')" id="nav-score" class="flex flex-col items-center text-indigo-600 font-bold text-xs"><i class="fa-solid fa-pen-to-square text-lg mb-0.5"></i> Chấm điểm</button>
    <button type="button" onclick="window.switchTab('feed')" id="nav-feed" class="flex flex-col items-center text-slate-400 font-medium text-xs"><i class="fa-solid fa-bolt text-lg mb-0.5"></i> Nhật ký Live</button>
    <button type="button" onclick="window.switchTab('leaderboard')" id="nav-leaderboard" class="flex flex-col items-center text-slate-400 font-medium text-xs"><i class="fa-solid fa-trophy text-lg mb-0.5"></i> Xếp hạng</button>
  </nav>

  <script>
    var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyIAa7X6S09izY9VRbWdydNe7yi9cB0EWoJLR2qyFDk5QdM-WMIK5W0_hiwYx8sZpGG/exec";
    var ALL_TURNS = ["L1", "L2", "L3", "L4", "L5", "L6"];
    var appState = { activeMatch: null, matches: [], teams: [], logs: [] };
    var selectedTeamId = "";
    var selectedMode = "Tính giờ";
    var selectedTurn = "L1";
    var refereeName = localStorage.getItem("tb_referee_name") || "";

    window.checkRefereeName = function() {
      if (!refereeName) {
        document.getElementById("refereeNameModal").classList.remove("hidden");
      } else {
        document.getElementById("refereeNameModal").classList.add("hidden");
        document.getElementById("currentRefNameLabel").textContent = refereeName;
      }
    };

    window.saveRefereeName = function() {
      var val = document.getElementById("refereeNameInput").value.trim();
      if (!val) { alert("Vui lòng nhập họ tên của bạn!"); return; }
      refereeName = val;
      localStorage.setItem("tb_referee_name", val);
      document.getElementById("currentRefNameLabel").textContent = val;
      document.getElementById("refereeNameModal").classList.add("hidden");
      window.showToast("Xin chào Trọng tài: " + val);
    };

    window.promptEditRefereeName = function() {
      var newName = prompt("Chỉnh sửa Họ & Tên Trọng Tài:", refereeName);
      if (newName && newName.trim()) {
        refereeName = newName.trim();
        localStorage.setItem("tb_referee_name", refereeName);
        document.getElementById("currentRefNameLabel").textContent = refereeName;
        window.showToast("Đã cập nhật tên trọng tài!");
      }
    };

    window.showToast = function(msg, isError) {
      var t = document.getElementById("toast");
      t.textContent = msg;
      t.className = "fixed top-16 left-1/2 -translate-x-1/2 text-white text-xs font-bold px-4 py-2.5 rounded-full shadow-lg z-50 " + (isError ? "bg-red-600" : "bg-emerald-600");
      t.classList.remove("hidden");
      setTimeout(function() { t.classList.add("hidden"); }, 2500);
    };

    window.fetchData = async function(showSpinner) {
      var icon = document.getElementById("syncIcon");
      if (showSpinner) icon.classList.add("fa-spin");
      try {
        var res = await fetch(SCRIPT_URL);
        appState = await res.json();
        window.renderAll();
      } catch (e) {
        console.error(e);
      } finally {
        if (showSpinner) icon.classList.remove("fa-spin");
      }
    };

    window.renderAll = function() {
      var match = appState.activeMatch;
      document.getElementById("activeMatchLabel").textContent = match ? "Trận: " + match.name : "Không có trận Đang diễn ra";

      if (match) {
        var lockedTeam = localStorage.getItem("tb_locked_team_" + match.id);
        if (lockedTeam && appState.teams.some(function(t) { return t.id === lockedTeam; })) {
          selectedTeamId = lockedTeam;
        }
      }

      window.renderTeamButtons();
      window.renderTurnButtons();
      window.renderLiveFeed();
      window.renderLeaderboard();
    };

    window.renderTeamButtons = function() {
      var container = document.getElementById("teamButtonsContainer");
      if (!appState.teams || !appState.teams.length) {
        container.innerHTML = '<div class="col-span-2 text-xs text-slate-400 italic">Chưa có đội chơi.</div>';
        return;
      }

      var matchId = appState.activeMatch ? appState.activeMatch.id : "";
      var isLocked = matchId && !!localStorage.getItem("tb_locked_team_" + matchId);

      container.innerHTML = appState.teams.map(function(t) {
        var isSelected = t.id === selectedTeamId;
        if (isLocked) {
          if (isSelected) {
            return '<button type="button" disabled class="p-2.5 rounded-xl border-2 border-indigo-600 bg-indigo-50 text-indigo-900 font-bold shadow-sm flex items-center justify-between"><span class="text-xs flex items-center gap-1.5 truncate"><span class="w-3 h-3 rounded-full inline-block shrink-0" style="background:' + t.color + '"></span>' + t.name + '</span><i class="fa-solid fa-lock text-indigo-600 text-sm"></i></button>';
          } else {
            return '<button type="button" disabled class="p-2.5 rounded-xl border border-slate-200 bg-slate-100 text-slate-400 opacity-40 font-medium flex items-center justify-between cursor-not-allowed"><span class="text-xs flex items-center gap-1.5 truncate"><span class="w-3 h-3 rounded-full inline-block shrink-0" style="background:' + t.color + '"></span>' + t.name + '</span></button>';
          }
        } else {
          return '<button type="button" onclick="window.lockAndSelectTeam(\'' + t.id + '\')" class="p-2.5 rounded-xl border-2 text-left transition flex items-center justify-between ' + (isSelected ? 'border-indigo-600 bg-indigo-50 text-indigo-900 font-bold' : 'border-slate-200 bg-white text-slate-700 font-medium') + '"><span class="text-xs flex items-center gap-1.5 truncate"><span class="w-3 h-3 rounded-full inline-block shrink-0" style="background:' + t.color + '"></span>' + t.name + '</span>' + (isSelected ? '<i class="fa-solid fa-circle-check text-indigo-600 text-sm"></i>' : '') + '</button>';
        }
      }).join("");

      document.getElementById("teamLockHint").textContent = isLocked ? "Máy đã khóa cứng với Đội này" : "Bấm chọn đội để khóa vào máy";
    };

    window.lockAndSelectTeam = function(idDoi) {
      if (!confirm("XÁC NHẬN: Bạn sẽ phụ trách chấm điểm cho đội này suốt trận đấu và KHÔNG THỂ THAY ĐỔI sang đội khác. Tiếp tục?")) return;
      selectedTeamId = idDoi;
      if (appState.activeMatch) {
        localStorage.setItem("tb_locked_team_" + appState.activeMatch.id, idDoi);
      }
      window.renderTeamButtons();
      window.renderTurnButtons();
    };

    window.selectMode = function(mode) {
      selectedMode = mode;
      ["Tính giờ", "Đếm số", "Thêm điểm"].forEach(function(m) {
        var btnId = m === "Tính giờ" ? "mode-TinhGio" : (m === "Đếm số" ? "mode-DemSo" : "mode-ThemDiem");
        document.getElementById(btnId).className = m === mode
          ? "mode-btn py-2.5 px-2 rounded-xl font-bold text-xs border-2 border-indigo-600 bg-indigo-600 text-white shadow-sm flex flex-col items-center gap-1"
          : "mode-btn py-2.5 px-2 rounded-xl font-bold text-xs border-2 border-slate-200 bg-slate-50 text-slate-600 flex flex-col items-center gap-1";
      });
      var isRanked = (mode !== "Thêm điểm");
      document.getElementById("turnSection").classList.toggle("hidden", !isRanked);
      document.getElementById("foulSection").classList.toggle("hidden", !isRanked);
      if (!isRanked) document.getElementById("foulCheckbox").checked = false;
      window.updateInputVisibility();
      window.renderTurnButtons();
    };

    window.getNextAllowedTurn = function() {
      if (!selectedTeamId || selectedMode === "Thêm điểm") return "L1";
      var usedTurns = appState.logs.filter(function(l) { return l.idDoi === selectedTeamId && l.cheDo === selectedMode; }).map(function(l) { return l.luotChoi; });
      var maxIdx = -1;
      usedTurns.forEach(function(t) { var idx = ALL_TURNS.indexOf(t); if (idx > maxIdx) maxIdx = idx; });
      return (maxIdx + 1 < ALL_TURNS.length) ? ALL_TURNS[maxIdx + 1] : null;
    };

    window.renderTurnButtons = function() {
      var container = document.getElementById("turnButtonsContainer");
      var nextTurn = window.getNextAllowedTurn();
      selectedTurn = nextTurn || "";
      var usedTurns = appState.logs.filter(function(l) { return l.idDoi === selectedTeamId && l.cheDo === selectedMode; }).map(function(l) { return l.luotChoi; });
      var maxIdx = -1;
      usedTurns.forEach(function(t) { var idx = ALL_TURNS.indexOf(t); if (idx > maxIdx) maxIdx = idx; });

      container.innerHTML = ALL_TURNS.map(function(turn, idx) {
        if (idx <= maxIdx) {
          return '<button type="button" disabled class="turn-locked py-2.5 rounded-xl border border-slate-300 bg-slate-200 text-slate-500 font-bold text-xs flex flex-col items-center"><span>' + turn + '</span><i class="fa-solid fa-lock text-[10px] mt-0.5"></i></button>';
        } else if (turn === nextTurn) {
          return '<button type="button" onclick="selectedTurn=\'' + turn + '\'" class="py-2.5 rounded-xl border-2 border-indigo-600 bg-indigo-600 text-white font-bold text-xs shadow-sm flex flex-col items-center"><span>' + turn + '</span><i class="fa-solid fa-check text-[10px] mt-0.5"></i></button>';
        } else {
          return '<button type="button" disabled class="opacity-50 cursor-not-allowed py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-slate-400 font-bold text-xs flex flex-col items-center"><span>' + turn + '</span><i class="fa-solid fa-hourglass-half text-[10px] mt-0.5"></i></button>';
        }
      }).join("");
      document.getElementById("turnStatusHint").textContent = nextTurn ? "Mở: " + nextTurn : "Đã hoàn thành 6 lượt!";
    };

    window.updateInputVisibility = function() {
      var isFoul = document.getElementById("foulCheckbox").checked;
      document.getElementById("timeInputsSection").classList.toggle("hidden", !(selectedMode === "Tính giờ" && !isFoul));
      document.getElementById("countInputsSection").classList.toggle("hidden", !(selectedMode === "Đếm số" && !isFoul));
      document.getElementById("directPointsSection").classList.toggle("hidden", selectedMode !== "Thêm điểm");
    };

    window.setDirectPoint = function(val) { document.getElementById("inputDirectPoints").value = val; };

    window.submitScore = async function() {
      if (!refereeName) { window.checkRefereeName(); return; }
      if (!appState.activeMatch) return window.showToast("Không có trận Đang diễn ra!", true);
      if (!selectedTeamId) return window.showToast("Vui lòng chọn đội để khóa vào máy!", true);

      var isFoul = document.getElementById("foulCheckbox").checked;
      var thoiGianGiay = 0, soThanhVien = 0, soLuongDem = 0, diemTrucTiep = 0;

      if (selectedMode !== "Thêm điểm" && !selectedTurn) return window.showToast("Đã hết lượt chơi!", true);
      if (selectedMode === "Tính giờ" && !isFoul) {
        thoiGianGiay = parseFloat(document.getElementById("inputSeconds").value);
        soThanhVien = parseInt(document.getElementById("inputMembers").value) || 0;
        if (!thoiGianGiay || thoiGianGiay <= 0) return window.showToast("Nhập thời gian hợp lệ!", true);
      } else if (selectedMode === "Đếm số" && !isFoul) {
        soLuongDem = parseInt(document.getElementById("inputCount").value);
        if (!soLuongDem || soLuongDem <= 0) return window.showToast("Nhập số lượng đếm!", true);
      } else if (selectedMode === "Thêm điểm") {
        diemTrucTiep = parseInt(document.getElementById("inputDirectPoints").value);
        if (isNaN(diemTrucTiep) || diemTrucTiep === 0) return window.showToast("Nhập điểm cộng!", true);
      }

      var btn = document.getElementById("submitBtn");
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> ĐANG GỬI...';

      try {
        var res = await fetch(SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify({
            action: "ADD_SCORE", idDoi: selectedTeamId, cheDo: selectedMode,
            luotChoi: selectedMode === "Thêm điểm" ? "" : selectedTurn,
            thoiGianGiay: thoiGianGiay, soThanhVien: soThanhVien, soLuongDem: soLuongDem,
            phamQuy: isFoul, diemTrucTiep: diemTrucTiep, trongTai: refereeName
          })
        });
        var result = await res.json();
        if (result.status === "success") {
          appState = result.data;
          document.getElementById("inputSeconds").value = "";
          document.getElementById("inputMembers").value = "";
          document.getElementById("inputCount").value = "";
          document.getElementById("foulCheckbox").checked = false;
          window.updateInputVisibility();
          window.renderAll();
          window.showToast("Đã lưu điểm thành công!");
          window.switchTab("score");
        } else {
          window.showToast(result.message || "Lỗi lưu điểm!", true);
        }
      } catch (e) {
        window.showToast("Lỗi kết nối mạng!", true);
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> LƯU ĐIỂM NGAY';
      }
    };

    window.renderLiveFeed = function() {
      var container = document.getElementById("liveFeedContainer");
      document.getElementById("logCountBadge").textContent = appState.logs.length + " lượt";
      if (!appState.logs.length) {
        container.innerHTML = '<div class="bg-white p-6 rounded-2xl text-center text-xs text-slate-400">Chưa có lượt chấm điểm nào.</div>';
        return;
      }
      container.innerHTML = appState.logs.map(function(log) {
        return '<div class="bg-white p-3.5 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between">' +
          '<div class="space-y-0.5">' +
            '<div class="font-bold text-sm text-slate-800 flex items-center gap-1.5">' +
              '<span class="w-2.5 h-2.5 rounded-full inline-block" style="background:' + log.mauSac + '"></span>' +
              log.tenDoi +
            '</div>' +
            '<div class="text-xs font-semibold ' + (log.phamQuy ? 'text-red-600' : 'text-indigo-600') + '">' +
              log.hienThiNhatKy +
            '</div>' +
            '<div class="text-[11px] text-slate-500 font-medium flex items-center gap-1">' +
              '<i class="fa-solid fa-user-check text-indigo-500"></i> TT: <span class="font-bold text-slate-700">' + (log.trongTai || 'Ẩn danh') + '</span>' +
              (log.cheDo !== 'Thêm điểm' && !log.phamQuy ? ' • TB: ' + (log.tgTrungBinh || log.soLuongDem) + ' • Hạng ' + log.hangThuThach : '') +
            '</div>' +
          '</div>' +
          '<span class="px-3 py-1 rounded-xl font-extrabold text-sm ' + (log.phamQuy ? 'bg-red-100 text-red-700' : 'bg-emerald-100 text-emerald-700') + '">' +
            (log.phamQuy ? '0đ' : '+' + log.diemDatDuoc + 'đ') +
          '</span>' +
        '</div>';
      }).join("");
    };

    window.renderLeaderboard = function() {
      var container = document.getElementById("leaderboardContainer");
      if (!appState.teams || !appState.teams.length) {
        container.innerHTML = '<div class="bg-white p-6 rounded-2xl text-center text-xs text-slate-400">Chưa có đội.</div>';
        return;
      }
      container.innerHTML = appState.teams.map(function(t, idx) {
        var badgeColor = idx === 0 ? "bg-amber-400 text-slate-900" : (idx === 1 ? "bg-slate-300" : "bg-amber-700 text-white");
        return '<div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between">' +
          '<div class="flex items-center gap-3">' +
            '<span class="w-8 h-8 rounded-full font-extrabold text-xs flex items-center justify-center ' + badgeColor + '">#' + (idx + 1) + '</span>' +
            '<div class="font-bold text-sm text-slate-800 flex items-center gap-1.5"><span class="w-3 h-3 rounded-full inline-block" style="background:' + t.color + '"></span>' + t.name + '</div>' +
          '</div>' +
          '<div class="text-lg font-extrabold text-indigo-700">' + t.totalScore + ' đ</div>' +
        '</div>';
      }).join("");
    };

    window.switchTab = function(tab) {
      ["score", "feed", "leaderboard"].forEach(function(t) {
        document.getElementById("tab-" + t).classList.toggle("hidden", t !== tab);
        document.getElementById("nav-" + t).className = t === tab 
          ? "flex flex-col items-center text-indigo-600 font-bold text-xs" 
          : "flex flex-col items-center text-slate-400 font-medium text-xs";
      });
    };

    window.addEventListener("DOMContentLoaded", function() {
      window.checkRefereeName();
      window.selectMode("Tính giờ");
      window.fetchData(true);
      setInterval(function() { window.fetchData(false); }, 8000);
    });
  </script>
</body>
</html>
